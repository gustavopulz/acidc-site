services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acidc-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: "file:/app/prisma/prod.db"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@acidc.com.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      FRONTEND_URL: "${FRONTEND_URL:-https://acidc.com.br}"
      NODE_ENV: production
    volumes:
      - backend_db:/app/prisma
      - backend_uploads:/app/public/uploads
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.acidc_api.rule=Host(`acidc.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.acidc_api.priority=20"
      - "traefik.http.routers.acidc_api.entrypoints=websecure"
      - "traefik.http.routers.acidc_api.tls=true"
      - "traefik.http.routers.acidc_api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acidc_api.service=acidc_backend"

      - "traefik.http.routers.acidc_uploads.rule=Host(`acidc.com.br`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.acidc_uploads.priority=20"
      - "traefik.http.routers.acidc_uploads.entrypoints=websecure"
      - "traefik.http.routers.acidc_uploads.tls=true"
      - "traefik.http.routers.acidc_uploads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acidc_uploads.service=acidc_backend"

      - "traefik.http.services.acidc_backend.loadbalancer.server.port=3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://acidc.com.br}"
    container_name: acidc-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.acidc.rule=Host(`acidc.com.br`)"
      - "traefik.http.routers.acidc.priority=1"
      - "traefik.http.routers.acidc.entrypoints=websecure"
      - "traefik.http.routers.acidc.tls=true"
      - "traefik.http.routers.acidc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acidc.service=acidc_frontend"

      - "traefik.http.routers.acidc_www.rule=Host(`www.acidc.com.br`)"
      - "traefik.http.routers.acidc_www.priority=100"
      - "traefik.http.routers.acidc_www.entrypoints=websecure"
      - "traefik.http.routers.acidc_www.tls=true"
      - "traefik.http.routers.acidc_www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.acidc_www.middlewares=acidc-www-redirect"
      - "traefik.http.routers.acidc_www.service=acidc_frontend"

      - "traefik.http.middlewares.acidc-www-redirect.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.acidc-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.acidc-www-redirect.redirectregex.permanent=true"

      - "traefik.http.services.acidc_frontend.loadbalancer.server.port=80"

volumes:
  backend_db:
  backend_uploads:

networks:
  proxy:
    external: true
    name: proxy
