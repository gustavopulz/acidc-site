services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acidc-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: "file:/app/prisma/prod.db"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@acidc.com.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      FRONTEND_URL: "${FRONTEND_URL:-https://acidc.com.br}"
      NODE_ENV: production
    volumes:
      - backend_db:/app/prisma
      - backend_uploads:/app/public/uploads
    networks:
      - acidc_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://acidc.com.br}"
    container_name: acidc-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acidc_network

  nginx:
    image: nginx:1.27-alpine
    container_name: acidc-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
      - backend_uploads:/app/public/uploads:ro
    networks:
      - acidc_network

  certbot:
    image: certbot/certbot:latest
    container_name: acidc-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    networks:
      - acidc_network

volumes:
  backend_db:
  backend_uploads:
  certbot_www:
  certbot_etc:

networks:
  acidc_network:
    driver: bridge
