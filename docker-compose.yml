version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acidc-backend
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: "file:/app/prisma/prod.db"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@acidc.com.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-acidc@admin2024}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      NODE_ENV: production
    volumes:
      - backend_db:/app/prisma
      - backend_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/shows"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3001}"
    container_name: acidc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_db:
  backend_uploads:
