services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acidc-backend
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: "file:/app/prisma/prod.db"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@acidc.com.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-acidc@admin2024}"
      FRONTEND_URL: "${FRONTEND_URL:-https://acidc.com.br}"
      NODE_ENV: production
    volumes:
      - backend_db:/app/prisma
      - backend_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://acidc.com.br:3002}"
    container_name: acidc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_db:
  backend_uploads:
